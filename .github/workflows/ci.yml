name: CI

on:
  push:
    branches:
      - main
      - main-merge
      - dev/**
  pull_request:
    branches:
      - main
      - main-merge

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build --workspace=shared
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build --workspace=shared
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cardplay_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: cardplay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cardplay_test -d cardplay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgres://cardplay_test:test_password@localhost:5432/cardplay_test
      JWT_SECRET: ci_test_jwt_secret_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      JWT_REFRESH_SECRET: ci_test_refresh_secret_bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CLIENT_ORIGIN: http://localhost:5173
      ALLOW_TEST_SEED: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build --workspace=shared
      - run: npm run db:migrate
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - lint
      - typecheck
      - test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:3000/api/v1
          VITE_SOCKET_URL: http://localhost:3000

      - run: |
          test -d shared/dist || (echo "❌ brak shared/dist" && exit 1)
          test -d server/dist || (echo "❌ brak server/dist" && exit 1)
          test -d client/dist || (echo "❌ brak client/dist" && exit 1)
          echo "✅ build OK"